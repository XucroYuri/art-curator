[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "art-curator"
version = "0.1.0"
description = "Local zero-training image curation and offline review studio"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "torchvision", "transformers<5", "pyiqa", "aesthetic-predictor-v2-5", "ImageHash", "Pillow", "numpy", "PyYAML", "pydantic>=2", "accelerate"]

[project.scripts]
artcurator = "artcurator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artcurator"]

[tool.hatch.build.targets.sdist]
only-include = ["src/artcurator", "tests", "tools", "docs", "README.md", "README.zh-CN.md", "DESIGN.md", "CONTRIBUTING.md", "LICENSE", "THIRD_PARTY_LICENSES.md", "config.example.yaml", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "all"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
