# Copy to config.yaml, then replace these placeholder paths with your local paths.
# Do not commit config.yaml. Run commands from the repository root.
input: /path/to/image-library/subject/queue
references: /path/to/image-library/subject/references
posted: /path/to/image-library/subject/posted
characters_root: /path/to/image-library
out: out/library
batch_size: 16
workers: 8
prefetch_batches: 2
uncertain: 1.2
gaming_suspect: 0.35
nsfw_route: 0.65
nsfw_queue: 0.35
identity_route_quantile: 0.10
identity_queue_quantile: 0.20
queue_quantile: 0.90
review_quantile: 0.75
confusable_margin: 0.05
champion_slack: 0.15
# Fixed requested roster, never inferred from surviving scores. Legacy runs may explicitly
# select four-means-v1; the default five-means-v1 requires HPSv3 mean and sigma.
quality_profile: five-means-v1
identity:
  device: auto  # CUDA only for a matching numerical certificate; otherwise CPU.
  precision: float32  # FP16 failed the predeclared CPU/GPU numerical budget.
  batch_size: 16  # Independent of the legacy scorer batch; CPU always uses 1.
  embedder: siglip
  anchor_faces_per_character: 64
  anchor_det_score: 0.7
  anchor_phash_distance: 4
  anchor_exclude_folders: []  # Root-relative non-character directories; corpus directories auto-excluded.
  anchor_min_sim: null  # Reference-only impostor centroid P95 measured during anchor construction.
  anchor_min_margin: null  # max(0.005, reference-only positive stable-margin P10).
